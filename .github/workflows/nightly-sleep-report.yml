name: Nightly Semantic Maintenance Report

on:
  # Retired from automatic operation by the source-first cutover. This remains
  # manual-only for inspecting the archived legacy system.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-semantic-maintenance-report
  cancel-in-progress: false

jobs:
  nightly-semantic-maintenance-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: distillation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r distillation/requirements.txt

      - name: Verify latest automatic semantic-maintenance run
        run: |
          python scripts/nightly_semantic_maintenance.py --check-latest --max-age-hours 4

      - name: Upload sleep report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-semantic-maintenance-report
          path: |
            scripts/reports/nightly_semantic_maintenance_*.json
          if-no-files-found: warn
