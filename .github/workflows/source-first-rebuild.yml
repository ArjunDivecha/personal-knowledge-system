name: Source-First Memory Rebuild

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish and atomically promote the verified generation"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-first-memory-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    # GitHub owns the schedule and the stage -> gate -> promote pipeline; this
    # self-hosted runner reads the authoritative Dropbox folders on the Mac.
    # GitHub cron ticks are best-effort and were observed firing ~5.5x/day
    # instead of 12x (median gap 4.2h, max 12.6h, 2026-08-24..09-04). A local
    # LaunchAgent (launchd/com.arjundivecha.pks-rebuild-kicker.plist ->
    # scripts/kick_source_first_rebuild.sh) dispatches `workflow_dispatch` when
    # no run has started in 2h. It never builds or promotes locally.
    runs-on: [self-hosted, macOS, knowledge-agent-sessions]
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
      UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
      PYTHON_BIN: /opt/homebrew/bin/python3.12
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create minimal runtime
        run: |
          "$PYTHON_BIN" -m venv ingestion/.venv-source-first
          . ingestion/.venv-source-first/bin/activate
          python -m pip install --upgrade pip
          python -m pip install openai upstash-redis upstash-vector python-dotenv requests

      - name: Install Worker evaluation runtime
        working-directory: cloudflare-mcp/mcp-server
        run: |
          npm ci

      - name: Build and stage immutable candidate
        id: stage
        run: |
          . ingestion/.venv-source-first/bin/activate
          caffeinate -i python scripts/source_first_rebuild.py --stage | tee /tmp/source-first-stage.json
          generation=$(python -c 'import json; print(json.load(open("/tmp/source-first-stage.json"))["manifest"]["generation"])')
          test -n "$generation"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Verify candidate storage completeness
        run: |
          . ingestion/.venv-source-first/bin/activate
          python scripts/source_first_rebuild.py --verify-generation "${{ steps.stage.outputs.generation }}"

      - name: Run exact production retrieval policy against candidate
        working-directory: cloudflare-mcp/mcp-server
        run: |
          npm run test:source-first-candidate -- \
            "${{ steps.stage.outputs.generation }}" \
            "$GITHUB_WORKSPACE/scripts/reports/source_first/candidate-eval-${{ steps.stage.outputs.generation }}.json"

      - name: Atomically promote verified candidate
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          . ingestion/.venv-source-first/bin/activate
          python scripts/source_first_rebuild.py --promote-generation "${{ steps.stage.outputs.generation }}"

      - name: Verify the serving generation
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          . ingestion/.venv-source-first/bin/activate
          python scripts/source_first_rebuild.py --verify-current --max-age-hours 6

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-first-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/reports/source_first/*/manifest.json
            scripts/reports/source_first/*/projects.json
            scripts/reports/source_first/*/suppressions.json
            scripts/reports/source_first/candidate-eval-*.json
            scripts/reports/eval_baseline_*.json
          if-no-files-found: error
          retention-days: 30
