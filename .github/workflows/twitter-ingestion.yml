name: Twitter Ingestion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to storage"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Ignore saved since_id and force a full refetch"
        required: false
        default: false
        type: boolean
      max_tweets:
        description: "Optional max tweets to process"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: twitter-ingestion
  cancel-in-progress: false

jobs:
  twitter-ingestion:
    runs-on: [self-hosted, macOS, knowledge-agent-sessions]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ingestion

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
      UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
      PYTHONUNBUFFERED: "1"
      ARCHIVE_PATH: /tmp/knowledge-system/archive
      PYTHON_BIN: /opt/homebrew/bin/python3.12
      PKS_ALLOW_ANTHROPIC_API_FALLBACK: "0"
      PKS_SDK_MAX_TURNS: "1"
      PKS_SDK_MAX_BUDGET_USD: "0.25"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check SDK runtime
        run: |
          "$PYTHON_BIN" --version
          command -v claude
          claude --version

      - name: Install dependencies
        run: |
          "$PYTHON_BIN" -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r ../distillation/requirements.txt
          python - <<'PY'
          from claude_agent_sdk import query, ClaudeAgentOptions
          print("claude_agent_sdk import OK")
          PY

      - name: Run Twitter ingestion
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || 'false' }}
          MAX_TWEETS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_tweets || '' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$RESET_STATE" = "true" ]; then
            args+=(--reset-state)
          else
            args+=(--require-redis-state)
          fi
          if [ -n "$MAX_TWEETS" ]; then
            args+=(--max "$MAX_TWEETS")
          fi
          caffeinate -i .venv/bin/python twitter/run.py "${args[@]}"
