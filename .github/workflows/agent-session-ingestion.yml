name: Agent Session Ingestion

on:
  repository_dispatch:
    types:
      - agent-session-ingestion-manual
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to storage"
        required: false
        default: false
        type: boolean
      backfill:
        description: "Ignore existing checkpoint and process all history"
        required: false
        default: false
        type: boolean
      sync_state_only:
        description: "Mirror the current checkpoint into Redis/file and exit"
        required: false
        default: false
        type: boolean
      source:
        description: "Optional source filter (claude_code or codex_cli)"
        required: false
        type: choice
        options:
          - ""
          - claude_code
          - codex_cli
      limit:
        description: "Optional max number of files to process"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-session-ingestion
  cancel-in-progress: false

jobs:
  agent-session-ingestion:
    runs-on: [self-hosted, macOS, knowledge-agent-sessions]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ingestion

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
      UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
      GITHUB_API_KEY: ${{ secrets.GITHUB_API_KEY }}
      GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
      PYTHON_BIN: /opt/homebrew/bin/python3.12
      PYTHONUNBUFFERED: "1"
      PKS_ALLOW_ANTHROPIC_API_FALLBACK: "0"
      PKS_SDK_MAX_TURNS: "4"
      PKS_SDK_MAX_BUDGET_USD: "0.25"
      PKS_API_FALLBACK_RESERVE_USD: "0.25"
      PKS_API_FALLBACK_RUN_MAX_BUDGET_USD: "5.00"
      PKS_API_FALLBACK_MAX_CALLS: "200"
      PKS_API_FALLBACK_BUDGET_FILE: /tmp/pks-api-fallback-${{ github.run_id }}-${{ github.run_attempt }}.json
      PKS_SDK_MODEL: sonnet

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Python
        run: |
          "$PYTHON_BIN" --version
          command -v claude
          claude --version

      - name: Install dependencies
        run: |
          "$PYTHON_BIN" -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r ../distillation/requirements.txt
          python - <<'PY'
          from claude_agent_sdk import query, ClaudeAgentOptions
          print("claude_agent_sdk import OK")
          PY

      - name: Select Claude billing route
        id: claude_route
        run: |
          . .venv/bin/activate
          if python ../scripts/check_claude_sdk_auth.py >/tmp/pks-sdk-auth.log 2>&1; then
            echo "billing_source=sdk" >> "$GITHUB_OUTPUT"
            echo "PKS_ALLOW_ANTHROPIC_API_FALLBACK=0" >> "$GITHUB_ENV"
            echo "Claude Agent SDK inference preflight OK; using SDK billing route."
          else
            echo "billing_source=api_fallback" >> "$GITHUB_OUTPUT"
            echo "PKS_ALLOW_ANTHROPIC_API_FALLBACK=1" >> "$GITHUB_ENV"
            grep -E "Claude Agent SDK preflight failed|Refusing to run ingestion SDK|unexpected SDK preflight response" /tmp/pks-sdk-auth.log || tail -n 5 /tmp/pks-sdk-auth.log
            echo "::warning::Claude Agent SDK subscription auth is unavailable in this GitHub runner; using Anthropic API fallback for this ingestion run."
          fi

      - name: Validate API fallback key
        if: steps.claude_route.outputs.billing_source == 'api_fallback'
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Claude SDK preflight failed and ANTHROPIC_API_KEY secret is not configured; API fallback cannot run."
            exit 1
          fi
          {
            echo "### Agent session ingestion API fallback"
            echo ""
            echo "Claude Agent SDK subscription auth was unavailable in this runner, so this run will use the project Anthropic API fallback."
            echo "Model: ${PKS_SDK_MODEL}; per-call budget: ${PKS_SDK_MAX_BUDGET_USD}; fallback reserve: ${PKS_API_FALLBACK_RESERVE_USD}; run budget: ${PKS_API_FALLBACK_RUN_MAX_BUDGET_USD}; call cap: ${PKS_API_FALLBACK_MAX_CALLS}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run agent session ingestion
        env:
          DRY_RUN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dry_run || github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKFILL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.backfill || github.event_name == 'workflow_dispatch' && inputs.backfill || 'false' }}
          SYNC_STATE_ONLY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sync_state_only || github.event_name == 'workflow_dispatch' && inputs.sync_state_only || 'false' }}
          SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || github.event_name == 'workflow_dispatch' && inputs.source || '' }}
          LIMIT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.limit || github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$BACKFILL" = "true" ]; then
            args+=(--backfill)
          elif [ "$SYNC_STATE_ONLY" != "true" ]; then
            args+=(--require-redis-state)
          fi
          if [ "$SYNC_STATE_ONLY" = "true" ]; then
            args+=(--sync-state-only)
          fi
          if [ -n "$SOURCE" ]; then
            args+=(--source "$SOURCE")
          fi
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          caffeinate -i .venv/bin/python agent_sessions/run.py "${args[@]}"
