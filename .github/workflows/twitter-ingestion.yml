name: Twitter Ingestion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to storage"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Ignore saved since_id and force a full refetch"
        required: false
        default: false
        type: boolean
      max_tweets:
        description: "Optional max tweets to process"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: twitter-ingestion
  cancel-in-progress: false

jobs:
  twitter-ingestion:
    runs-on: [self-hosted, macOS, knowledge-agent-sessions]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ingestion

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
      UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
      PYTHONUNBUFFERED: "1"
      ARCHIVE_PATH: /tmp/knowledge-system/archive
      PYTHON_BIN: /opt/homebrew/bin/python3.12
      PKS_ALLOW_ANTHROPIC_API_FALLBACK: "0"
      PKS_SDK_MAX_TURNS: "4"
      PKS_SDK_MAX_BUDGET_USD: "0.25"
      PKS_SDK_MODEL: sonnet

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check SDK runtime
        run: |
          "$PYTHON_BIN" --version
          command -v claude
          claude --version

      - name: Install dependencies
        run: |
          "$PYTHON_BIN" -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r ../distillation/requirements.txt
          python - <<'PY'
          from claude_agent_sdk import query, ClaudeAgentOptions
          print("claude_agent_sdk import OK")
          PY

      - name: Check real SDK auth
        id: sdk_auth
        run: |
          . .venv/bin/activate
          if python ../scripts/check_claude_sdk_auth.py >/tmp/pks-sdk-auth.log 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Claude Agent SDK inference preflight OK"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            grep -E "Claude Agent SDK preflight failed|Refusing to run ingestion SDK|unexpected SDK preflight response" /tmp/pks-sdk-auth.log || tail -n 5 /tmp/pks-sdk-auth.log
            echo "::warning::Claude Agent SDK subscription auth is unavailable in this GitHub runner; skipping ingestion. Run scripts/run_nightly_ingestion.sh on the local Mac for production ingestion."
          fi

      - name: Run Twitter ingestion
        if: steps.sdk_auth.outputs.available == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || 'false' }}
          MAX_TWEETS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_tweets || '' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$RESET_STATE" = "true" ]; then
            args+=(--reset-state)
          else
            args+=(--require-redis-state)
          fi
          if [ -n "$MAX_TWEETS" ]; then
            args+=(--max "$MAX_TWEETS")
          fi
          caffeinate -i .venv/bin/python twitter/run.py "${args[@]}"

      - name: Report skipped ingestion
        if: steps.sdk_auth.outputs.available != 'true'
        run: |
          {
            echo "### Twitter ingestion skipped"
            echo ""
            echo "Claude Agent SDK subscription auth was unavailable in this GitHub runner."
            echo "Production ingestion must run with scripts/run_nightly_ingestion.sh on the local Mac, or an API fallback must be enabled deliberately outside the default workflow path."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Twitter ingestion intentionally skipped because this runner cannot perform subscription-backed Claude Agent SDK inference."
