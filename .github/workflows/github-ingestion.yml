name: GitHub Ingestion

on:
  repository_dispatch:
    types:
      - github-ingestion-manual
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to storage"
        required: false
        default: false
        type: boolean
      no_resume:
        description: "Ignore processed-source checkpoints and rescan all repos"
        required: false
        default: false
        type: boolean
      repos:
        description: "Optional comma-separated repo list"
        required: false
        type: string
      skip_code:
        description: "Skip code comment extraction"
        required: false
        default: false
        type: boolean
      skip_commits:
        description: "Skip commit extraction"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-ingestion
  cancel-in-progress: false

jobs:
  github-ingestion:
    runs-on: [self-hosted, macOS, knowledge-agent-sessions]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ingestion

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
      UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
      GITHUB_API_KEY: ${{ secrets.PKS_GITHUB_API_KEY || github.token }}
      GITHUB_USERNAME: ${{ github.repository_owner }}
      PYTHONUNBUFFERED: "1"
      ARCHIVE_PATH: /tmp/knowledge-system/archive
      PYTHON_BIN: /opt/homebrew/bin/python3.12
      PKS_ALLOW_ANTHROPIC_API_FALLBACK: "0"
      PKS_SDK_MAX_TURNS: "4"
      PKS_SDK_MAX_BUDGET_USD: "0.25"
      PKS_SDK_MODEL: sonnet

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check SDK runtime
        run: |
          "$PYTHON_BIN" --version
          command -v claude
          claude --version

      - name: Install dependencies
        run: |
          "$PYTHON_BIN" -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r ../distillation/requirements.txt
          python - <<'PY'
          from claude_agent_sdk import query, ClaudeAgentOptions
          print("claude_agent_sdk import OK")
          PY

      - name: Check real SDK auth
        id: sdk_auth
        run: |
          . .venv/bin/activate
          if python ../scripts/check_claude_sdk_auth.py >/tmp/pks-sdk-auth.log 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Claude Agent SDK inference preflight OK"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            grep -E "Claude Agent SDK preflight failed|Refusing to run ingestion SDK|unexpected SDK preflight response" /tmp/pks-sdk-auth.log || tail -n 5 /tmp/pks-sdk-auth.log
            echo "::warning::Claude Agent SDK subscription auth is unavailable in this GitHub runner; skipping ingestion. Run scripts/run_nightly_ingestion.sh on the local Mac for production ingestion."
          fi

      - name: Run GitHub ingestion
        if: steps.sdk_auth.outputs.available == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dry_run || github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          NO_RESUME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.no_resume || github.event_name == 'workflow_dispatch' && inputs.no_resume || 'false' }}
          REPOS: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repos || github.event_name == 'workflow_dispatch' && inputs.repos || '' }}
          SKIP_CODE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.skip_code || github.event_name == 'workflow_dispatch' && inputs.skip_code || 'false' }}
          SKIP_COMMITS: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.skip_commits || github.event_name == 'workflow_dispatch' && inputs.skip_commits || 'false' }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$NO_RESUME" = "true" ]; then
            args+=(--no-resume)
          fi
          if [ "$SKIP_CODE" = "true" ]; then
            args+=(--skip-code)
          fi
          if [ "$SKIP_COMMITS" = "true" ]; then
            args+=(--skip-commits)
          fi
          if [ -n "$REPOS" ]; then
            args+=(--repos "$REPOS")
          fi
          caffeinate -i .venv/bin/python github/run.py "${args[@]}"

      - name: Report skipped ingestion
        if: steps.sdk_auth.outputs.available != 'true'
        run: |
          {
            echo "### GitHub ingestion skipped"
            echo ""
            echo "Claude Agent SDK subscription auth was unavailable in this GitHub runner."
            echo "Production ingestion must run with scripts/run_nightly_ingestion.sh on the local Mac, or an API fallback must be enabled deliberately outside the default workflow path."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub ingestion intentionally skipped because this runner cannot perform subscription-backed Claude Agent SDK inference."
